description: 'JD Business is the enterprise-facing arm of JD.com (Jingdong), one of China''s largest
  technology and retail companies, offering B2B procurement, supply-chain, and corporate purchasing
  services to businesses. JD.com operates across retail, logistics, technology, health, and industrials,
  and runs the JD Open Platform (JOS / "Zeus" Developer Center) at jos.jd.com, where third-party
  merchants and partners integrate with JD''s e-commerce, order, product, and logistics systems. This
  profile was surfaced as a portfolio-linked company and is being enriched from JD''s public surface;
  JD''s developer platform and enterprise services are primarily China-market and Chinese-language.'
